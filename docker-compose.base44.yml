services:
  web:
    image: oven/bun:1
    working_dir: /app
    restart: on-failure
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.output
      - /app/.nitro
      - /app/.tanstack
    ports:
      - "3000:3000"
    environment:
      # Vite >= 6.1 appends this to allowedHosts; the platform sets the value.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
    command: ["sh", "-ec", "bun install --frozen-lockfile && exec bun run dev -- --host 0.0.0.0 --port 3000"]
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
